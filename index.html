<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body onload="initGallery()">

  <header>
    <h1>Photo Bileeeeee</h1>
  </header>

  <main>
    <div class="gallery" id="gallery">

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=75"
          alt="Snow-capped mountain peaks rising through morning clouds" />
        <figcaption>Alpine Peaks at Dawn</figcaption>
      </figure>

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?w=600&q=75"
          alt="Dense tropical rainforest canopy with sunlight filtering through leaves" />
        <figcaption>Rainforest Canopy</figcaption>
      </figure>

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=75"
          alt="Calm turquoise ocean shoreline with white sand beach" />
        <figcaption>Turquoise Shore</figcaption>
      </figure>

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=600&q=75"
          alt="Red sandstone desert canyon with layered rock walls at sunset" />
        <figcaption>Desert Canyon</figcaption>
      </figure>

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600&q=75"
          alt="Green rice terraces carved into a hillside in Southeast Asia" />
        <figcaption>Rice Terraces</figcaption>
      </figure>

      <figure onmouseover="handleMouseOver(this)" onmouseleave="handleMouseLeave(this)" onfocus="handleFocus(this)"
        onblur="handleBlur(this)">
        <img src="https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=600&q=75"
          alt="Milky Way galaxy arching over a lone pine tree silhouette at night" />
        <figcaption>Milky Way Night</figcaption>
      </figure>

    </div>

    <p id="status" aria-live="polite"></p>
  </main>

  <script src="main.js"></script>
</body>

</html>
